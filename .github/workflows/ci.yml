name: CI

# Gate every PR and every push to main on lint, typecheck, the test coverage
# ratchet, the smoke eval, and a production build. Nothing merges red. Configure this workflow as
# a required status check in the repo's branch-protection rules for `main`.
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref so only the latest commit's CI runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Coverage thresholds live in vitest.config.ts (the ratchet). Coverage that
      # drops below them fails the run, so coverage can only go up.
      - name: Test (coverage ratchet)
        run: npm run test:cov

      # Replays recorded SSE through the real client stream code: saved answer ==
      # streamed answer, 13 cross-lane switches keep context, contract answers
      # parse, Stop keeps the partial. Mocked, no network, no spend. `eval:live`
      # and `eval:panel` are paid and never run in CI.
      - name: Smoke eval
        run: npm run eval:smoke

      # `next build` evaluates modules that validate env at import (src/lib/env.ts
      # via the Firebase clients), and firebase-admin parses the private key at
      # module load — so the build needs a *syntactically valid* PEM, not just a
      # non-empty string. We mint a throwaway keypair here rather than committing
      # one: it satisfies the parser, authenticates against nothing, and keeps the
      # repo free of anything that looks like a real credential.
      - name: Mint throwaway build credentials
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out "${RUNNER_TEMP}/ci-build-key.pem"
          {
            echo "FIREBASE_PRIVATE_KEY<<CI_PEM_EOF"
            cat "${RUNNER_TEMP}/ci-build-key.pem"
            echo "CI_PEM_EOF"
          } >> "$GITHUB_ENV"

      # The real project env is used by Vercel's deploy build; these placeholders
      # only need to satisfy the required-var checks so compilation can proceed.
      - name: Build
        run: npm run build
        env:
          FIREBASE_PROJECT_ID: ci-placeholder
          FIREBASE_CLIENT_EMAIL: ci@ci-placeholder.iam.gserviceaccount.com
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:ciplaceholder"
